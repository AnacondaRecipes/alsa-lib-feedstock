{% set name = "alsa-lib" %}
{% set version = "1.2.16.1" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # Official alsa-project.org release tarball (not the GitHub archive):
  # it ships a pre-generated ./configure + Makefile.in, so the build does
  # not need to run autoreconf. This avoids a hard `AC_PREREQ([2.72])`
  # requirement introduced upstream in 1.2.16 that pkgs/main's autoconf
  # (capped at 2.71) cannot satisfy.
  url: https://www.alsa-project.org/files/pub/lib/{{ name }}-{{ version }}.tar.bz2
  sha256: f740db7f488255944ffd4428416ee3390a96742856916433df468c281436480e

build:
  number: 0
  skip: true  # [not linux]
  run_exports:
    # https://abi-laboratory.pro/?view=timeline&l=alsa
    # Seems like they accidentally broke patch version ABI compatibility
    # and quickly fixed it.
    - {{ pin_subpackage("alsa-lib", max_pin="x.x") }}

requirements:
  build:
    - {{ stdlib("c") }}
    - {{ compiler('c') }}
    - make

test:
  commands:
    - test -f $PREFIX/lib/libasound${SHLIB_EXT}

about:
  home: https://www.alsa-project.org/main/index.php/Main_Page
  license: LGPL-2.1-or-later
  license_family: LGPL
  license_file: COPYING
  summary: Advanced Linux Sound Architecture
  description: Advanced Linux Sound Architecture
  dev_url: https://www.alsa-project.org/wiki/Download
  doc_url: https://www.alsa-project.org/wiki/Documentation

extra:
  recipe-maintainers:
    - scopatz
    - ocefpaf
    - ryanvolz
